name: Daily NSE, BSE, Market Mood & FII/DII Auto-Update

on:
  schedule:
    # 7 runs every trading day (Mon-Fri) in IST (UTC = IST - 5h30m):
    # 8:45 AM IST (Pre-market cues, dividends & watchlist)
    - cron: '15 3 * * 1-5'
    # 9:30 AM IST (Opening 15-min range)
    - cron: '0 4 * * 1-5'
    # 11:00 AM IST (Mid-morning momentum)
    - cron: '30 5 * * 1-5'
    # 12:30 PM IST (Mid-day Market Mood)
    - cron: '0 7 * * 1-5'
    # 2:15 PM IST (Pre-closing session check)
    - cron: '45 8 * * 1-5'
    # 3:45 PM IST (Official 3:30 PM NSE/BSE close)
    - cron: '15 10 * * 1-5'
    # 7:45 PM IST (Official NSE provisional FII/DII cash flows)
    - cron: '15 14 * * 1-5'
    # 10:00 AM IST Sat/Sun (Weekend news & sync)
    - cron: '30 4 * * 0,6'
  push:
    paths:
      - 'my_holdings.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yfinance
        run: pip install yfinance

      - name: Fetch latest NSE & BSE prices, Market Mood, News & FII/DII
        run: python scripts/update_daily_data.py

      - name: Commit & publish updated market data and news
        run: |
          git config user.name "BharatAlpha Bot"
          git config user.email "bot@users.noreply.github.com"
          git add daily_data.json market_all_stocks.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Auto-update NSE/BSE prices, Market Mood & FII/DII"
          git push
