name: Daily NSE, BSE & Market News Auto-Update

on:
  schedule:
    # Runs 3x EVERY day (Mon-Sun): 8:30 AM IST, 1:00 PM IST, and 4:05 PM IST
    - cron: '0 3 * * *'
    - cron: '30 7 * * *'
    - cron: '35 10 * * *'
  push:
    paths:
      - 'my_holdings.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yfinance
        run: pip install yfinance

      - name: Fetch latest NSE & BSE prices and market news
        run: python scripts/update_daily_data.py

      - name: Commit & publish updated market data and news
        run: |
          git config user.name "BharatAlpha Bot"
          git config user.email "bot@users.noreply.github.com"
          git add daily_data.json market_all_stocks.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Auto-update NSE/BSE prices and live market news"
          git push
