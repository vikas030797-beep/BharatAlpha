name: Daily NSE & My Holdings Auto-Update

on:
  schedule:
    # 3x weekday auto-updates (Mon-Fri): 8:30 AM IST, 1:00 PM IST, and 4:05 PM IST
    - cron: '0 3 * * 1-5'
    - cron: '30 7 * * 1-5'
    - cron: '35 10 * * 1-5'
  push:
    paths:
      - 'my_holdings.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yfinance
        run: pip install yfinance

      - name: Fetch latest NSE/BSE prices for My Holdings & Watchlist
        run: python scripts/update_daily_data.py

      - name: Commit & publish updated daily_data.json
        run: |
          git config user.name "BharatAlpha Bot"
          git config user.email "bot@users.noreply.github.com"
          git add daily_data.json market_all_stocks.json
          git diff --staged --quiet || git commit -m "Auto-update holdings & daily NSE prices"
          git push
